<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wearing Aesthetic Clothing</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="light-mode" id="theme-body">

    <header class="header">
        <div class="logo-container">
            <img src="logo-standard.png" alt="Wearing Aesthetic Logo" class="logo light-mode-logo" id="theme-logo">
            <img src="logo-dark.png" alt="Wearing Aesthetic Logo" class="logo dark-mode-logo">
        </div>
        
        <button class="theme-switch" id="theme-switch">
            <span class="mode-text">Mode:</span> 
            <span class="active-mode">Light</span> | Dark
        </button>
    </header>

    <main class="product-showcase">
        <div class="product-grid">
            <div class="product-card">
                <img src="user_tshirt_1.png" alt="Aesthetic Tee" class="product-image">
                <h3 class="product-title">AESTHETIC VINTAGE TEE (BLACK, M)</h3>
                <p class="product-price">3899/-</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="user_tshirt_2.png" alt="Boxy Fit Cargo" class="product-image">
                <h3 class="product-title">BOXY FIT CARGO SHORTS (OFF-WHITE, L)</h3>
                <p class="product-price">5999/-</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="social-links">
            <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-pinterest"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-linkedin-in"></i></a>
        </div>
        <p class="copyright">&copy; Wearing Aesthetic 2026. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
